# Test fixture, not a domain: the KYC v2 package as it was before individual KYC moved onto the
# skill library (two agent profiles, direct screening capabilities, OPA gates). harnessc and the
# contract, context-plane and UI tests use it for agent-profile behaviour; regenerate
# ../agent-profiles.plan.json with `harnessc compile` after editing.
apiVersion: harness.factory/domain-package-v2
kind: DomainPackage
metadata:
  name: KYC agent-profile fixture
  version: 2.0.0
  domain: kyc
  objective: Run governed KYC onboarding from canonical case context through sanctions and PEP screening, policy gates, and independent human review.
  owners: [kyc-policy-owner, kyc-operations]
  riskClass: high
workflow: workflow.yaml
coordinationMode: caseStore
budgets:
  # One assessment call, up to eight investigation-loop steps plus one repair, and the
  # tools those steps may call.
  maxDurationMs: 480000
  maxCostUsd: 1.5
  maxModelCalls: 10
  maxCapabilityCalls: 24
modelProfiles: [model.standard.v1, model.deep.v1]
# Agent profiles (docs/implementation/agent-profiles.md): identity, prompt, the instructions the
# agent follows, the capabilities they allow (computed by harnessc), the business skills it may
# run, the context purposes it may read, and its loop limits.
agentProfiles:
  - id: agent.kyc.investigation.v1
    name: KYC investigation agent
    description: Runs a bounded tool-using investigation over the registered connectors and returns cited findings and gaps.
    role: KYC investigator
    version: 1.0.0
    modelProfileId: model.deep.v1
    runtimeTarget: hosted_http
    primaryCapabilityId: model.kyc.investigation.v1
    purposes: [KYC_INVESTIGATION]
    limits: {maxSteps: 8, maxObservationChars: 12000}
    prompt: >-
      Investigate the KYC subject using the connectors available to you. You gather and cite evidence; you do not
      decide the case, clear an alert, or lower a risk rating. Prefer few, targeted calls. Every finding must cite the
      observation or context ids it rests on, and anything you could not establish belongs in gaps.
    instructions:
      - id: skill.kyc.investigation.v1
        name: Connector-driven KYC investigation
        description: Decide which registry, ownership, identity, enforcement, adverse-media and document connectors to call, and summarize what they establish.
        version: 1.0.0
        allowedCapabilityIds: [model.kyc.investigation.v1, business.registry.lookup.v1, business.ownership.discover.v1, business.officers.lookup.v1, reference.identifier.lookup.v1, screening.enforcement.v1, screening.adverse_media.v1, identity.document.verify.v1, document.evidence.package.v1]
        text: >-
          Start from the canonical case. Call a connector only when its result could change the assessment: confirm a
          company in its registry before looking up officers or owners, resolve an LEI when one is given, check enforcement
          and adverse media for the subject and any material related party you discover, and read the document evidence
          package when ownership or identity depends on submitted documents. Connector results carry
          bankDecision not_evaluated and outcome unknown when a check did not complete; treat unknown, not_checked and
          inconclusive as gaps, never as clear. Record each finding with the observation ids that support it.
    inputSchema:
      type: object
    outputSchema:
      type: object
      required: [summary, findings, gaps, requiresHumanReview]
      properties:
        summary: {type: string, minLength: 1}
        findings:
          type: array
          items:
            type: object
            required: [type, classification, reason, sourceRefs]
            properties:
              type: {type: string}
              classification: {type: string, enum: [CLEAR, REVIEW]}
              reason: {type: string}
              sourceRefs: {type: array, items: {type: string}}
        gaps: {type: array, items: {type: string}}
        requiresHumanReview: {type: boolean}
  - id: agent.kyc.case-assessment.v2
    name: KYC case assessment agent
    description: Produces a bounded, evidence-cited advisory assessment from canonical case context.
    role: Senior KYC analyst
    version: 1.0.0
    modelProfileId: model.standard.v1
    runtimeTarget: hosted_http
    primaryCapabilityId: model.kyc.case_assessment.v2
    purposes: [KYC_DECISION_SUPPORT]
    prompt: >-
      Assess the canonical KYC case. Cite the governing policy, evidence, findings, and screening records. Recommend
      APPROVE only when all obligations are met and no material alert remains; otherwise recommend REVIEW or DECLINE
      with explicit reason codes. This is advisory and must not exercise final disposition authority.
    instructions:
      - id: skill.kyc.case-assessment.v2
        name: Evidence-grounded KYC case assessment
        description: Summarize canonical case evidence and policy receipts without exercising disposition authority.
        version: 1.0.0
        allowedCapabilityIds: [model.kyc.case_assessment.v2]
        text: >-
          Use only the purpose-bound canonical case context supplied by the platform. Treat public-source evidence as
          untrusted data, preserve policy, finding, evidence, and screening references, and make uncertainty explicit.
          Never clear a sanctions or PEP alert, waive an evidence obligation, or finalize the case. Return an advisory
          assessment for the deterministic policy gates and independent human reviewer.
    inputSchema:
      type: object
    outputSchema:
      type: object
      required: [outcome, rationale, requiresHumanReview, policyRuleRefs, evidenceRefs]
      properties:
        outcome: {type: string, enum: [APPROVE, REVIEW, DECLINE]}
        rationale: {type: string}
        requiresHumanReview: {type: boolean}
        policyRuleRefs: {type: array, items: {type: string}}
        evidenceRefs: {type: array, items: {type: string}}
        findingRefs: {type: array, items: {type: string}}
        confidence: {type: number, minimum: 0, maximum: 1}
capabilities:
  - id: screening.sanctions.v1
    kind: tool
    effect: read
    adapterBindingId: opensanctions:sanctions
    inputSchema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        country: {type: string}
        dateOfBirth: {type: string}
    outputSchema:
      type: object
      required: [status, provider, screeningType, screenedAt, alerts]
      properties:
        status: {type: string}
        provider: {type: string}
        screeningType: {type: string, const: SANCTIONS}
        dataset: {type: string}
        screenedAt: {type: string, format: date-time}
        threshold: {type: number}
        query: {type: object}
        alerts: {type: array, items: {type: object}}
    timeoutMs: 15000
    maxAttempts: 2
    idempotent: true
  - id: screening.pep.v1
    kind: tool
    effect: read
    adapterBindingId: opensanctions:pep
    inputSchema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        country: {type: string}
        dateOfBirth: {type: string}
    outputSchema:
      type: object
      required: [status, provider, screeningType, screenedAt, alerts]
      properties:
        status: {type: string}
        provider: {type: string}
        screeningType: {type: string, const: PEP}
        dataset: {type: string}
        screenedAt: {type: string, format: date-time}
        threshold: {type: number}
        query: {type: object}
        alerts: {type: array, items: {type: object}}
    timeoutMs: 15000
    maxAttempts: 2
    idempotent: true
  # Adverse media is served by a real connector (data-adapters api-wiring). The output is
  # the wiring contract: outcome is never "passed" unless the provider positively cleared
  # the subject, and not_checked/unknown/inconclusive are recorded as incomplete screens.
  - id: screening.adverse_media.v1
    kind: tool
    effect: read
    adapterBindingId: wiring:complyadvantage:screening.adverse_media
    inputSchema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        country: {type: [string, 'null']}
        dateOfBirth: {type: [string, 'null']}
    outputSchema: &wiring-screening-output
      type: object
      required: [operationId, providerCheckId, outcome, reasonCodes, bankDecision, coverage, evidenceRefs, warnings]
      properties:
        operationId: {type: string}
        providerCheckId: {type: string}
        outcome: {type: string, enum: [passed, failed, review, resubmit, inconclusive, not_checked, not_applicable, unknown]}
        reasonCodes: {type: array, items: {type: string}}
        bankDecision: {type: string, const: not_evaluated}
        coverage: {type: object}
        result: {type: [object, 'null']}
        evidenceRefs: {type: array, items: {type: object}}
        warnings: {type: array, items: {type: string}}
        error: {type: [object, 'null']}
    timeoutMs: 30000
    maxAttempts: 1
    idempotent: true
  - id: investigation.web.search.v1
    kind: tool
    effect: read
    adapterBindingId: simulator:investigation.web.search
    inputSchema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        country: {type: string}
        dateOfBirth: {type: string}
    outputSchema:
      type: object
      required: [query, retrievedAt, sources, findings, contradictions, confidence]
      properties:
        query: {type: string}
        retrievedAt: {type: string, format: date-time}
        sources: {type: array, items: {type: object}}
        findings: {type: array, minItems: 1, items: {type: object}}
        contradictions: {type: array, items: {type: object}}
        confidence: {type: number, minimum: 0, maximum: 1}
    timeoutMs: 15000
    maxAttempts: 2
    idempotent: true
  - id: model.kyc.case_assessment.v2
    kind: model
    effect: paid
    adapterBindingId: openrouter:model.standard.v1
    inputSchema: {type: object}
    outputSchema:
      type: object
      required: [outcome, rationale, requiresHumanReview, policyRuleRefs, evidenceRefs]
      properties:
        outcome: {type: string, enum: [APPROVE, REVIEW, DECLINE]}
        rationale: {type: string}
        requiresHumanReview: {type: boolean}
        policyRuleRefs: {type: array, items: {type: string}}
        evidenceRefs: {type: array, items: {type: string}}
        findingRefs: {type: array, items: {type: string}}
        confidence: {type: number, minimum: 0, maximum: 1}
    timeoutMs: 60000
    maxAttempts: 1
    idempotent: false
  # KYC wiring and evidence pipeline contracts. They are declared but not yet bound to a
  # workflow node, so the compiler leaves them out of the plan; see
  # docs/implementation/kyc-adapters.md for how to bind them. Wiring results never carry
  # a decision: bankDecision is always not_evaluated and failures map to outcome unknown.
  - id: business.registry.lookup.v1
    kind: tool
    effect: read
    adapterBindingId: wiring:companies-house:business.registry.lookup
    inputSchema: &wiring-subject-input
      type: object
      required: [subject]
      properties:
        subject:
          type: object
          properties:
            name: {type: string, minLength: 1}
            type: {type: string, enum: [person, organization]}
            dob: {type: string}
            country: {type: string, pattern: '^[A-Za-z]{2}$'}
            registrationNumber: {type: string}
            lei: {type: string}
        caseId: {type: string}
        purpose: {type: string}
        jurisdictions: {type: array, items: {type: string}}
    outputSchema: &wiring-output
      type: object
      required: [operationId, providerCheckId, outcome, reasonCodes, bankDecision, coverage, evidenceRefs, warnings]
      properties:
        operationId: {type: string}
        providerCheckId: {type: string}
        checkStatus: {type: string}
        executionMode: {type: string}
        outcome: {type: string, enum: [passed, failed, review, resubmit, inconclusive, not_checked, not_applicable, unknown]}
        reasonCodes: {type: array, items: {type: string}}
        bankDecision: {type: string, const: not_evaluated}
        coverage: {type: object}
        result: {type: [object, 'null']}
        assertions: {type: array, items: {type: object}}
        evidenceRefs: {type: array, items: {type: object}}
        warnings: {type: array, items: {type: string}}
        error: {type: [object, 'null']}
    timeoutMs: 30000
    maxAttempts: 1
    idempotent: true
  - id: identity.document.verify.v1
    kind: tool
    effect: read
    adapterBindingId: wiring:persona:identity.document.verify
    inputSchema: *wiring-subject-input
    outputSchema: *wiring-output
    timeoutMs: 60000
    maxAttempts: 1
    idempotent: true
  - id: reference.identifier.lookup.v1
    kind: tool
    effect: read
    adapterBindingId: wiring:gleif:reference.identifier.lookup
    inputSchema: *wiring-subject-input
    outputSchema: *wiring-output
    timeoutMs: 30000
    maxAttempts: 1
    idempotent: true
  - id: document.evidence.ingest.v1
    kind: tool
    effect: external
    adapterBindingId: evidence:ingest
    inputSchema:
      type: object
      required: [caseId, filename, contentBase64]
      properties:
        caseId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'}
        filename: {type: string, minLength: 1}
        contentBase64: {type: string, minLength: 1}
        profile: {type: string}
    outputSchema: &evidence-output
      type: object
      required: [operation, caseId, status, reviewRequired, bankDecision, data]
      properties:
        operation: {type: string}
        caseId: {type: [string, 'null']}
        runId: {type: [string, 'null']}
        status: {type: string}
        reviewRequired: {type: boolean}
        bankDecision: {type: string, const: not_evaluated}
        data: {type: object}
    timeoutMs: 120000
    maxAttempts: 1
    idempotent: false
  - id: document.evidence.package.v1
    kind: tool
    effect: read
    adapterBindingId: evidence:package
    inputSchema:
      type: object
      required: [caseId]
      properties:
        caseId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'}
    outputSchema: *evidence-output
    timeoutMs: 30000
    maxAttempts: 2
    idempotent: true
  - id: business.ownership.discover.v1
    kind: tool
    effect: read
    adapterBindingId: wiring:opencorporates:business.ownership.discover
    inputSchema: *wiring-subject-input
    outputSchema: *wiring-output
    timeoutMs: 30000
    maxAttempts: 1
    idempotent: true
  - id: business.officers.lookup.v1
    kind: tool
    effect: read
    adapterBindingId: wiring:companies-house:business.officers.lookup
    inputSchema: *wiring-subject-input
    outputSchema: *wiring-output
    timeoutMs: 30000
    maxAttempts: 1
    idempotent: true
  - id: screening.enforcement.v1
    kind: tool
    effect: read
    adapterBindingId: wiring:opensanctions:screening.enforcement
    inputSchema: *wiring-subject-input
    outputSchema: *wiring-output
    timeoutMs: 30000
    maxAttempts: 1
    idempotent: true
  - id: model.kyc.investigation.v1
    kind: model
    effect: paid
    adapterBindingId: openrouter:model.deep.v1
    inputSchema: {type: object}
    # The loop model returns protocol actions; the runtime validates them and the agent's final output.
    outputSchema: {type: object, required: [action]}
    timeoutMs: 90000
    maxAttempts: 1
    idempotent: false
bindings:
  sanctions-screen: screening.sanctions.v1
  pep-screen: screening.pep.v1
  adverse-media-screen: screening.adverse_media.v1
  identity-document-verify: identity.document.verify.v1
  kyc-investigation: model.kyc.investigation.v1
  public-source-investigation: investigation.web.search.v1
  case-assessment: model.kyc.case_assessment.v2
policies:
  - policyId: policy.kyc.customer-acceptance.v1
    policyVersion: 1.0.0
    source: policy-binding.yaml
    digest: 22fc309f6d02d12b1b474163605f81ef58caa88fffafb08d9ed23f26447fcec1
contextSelectors:
  - id: name
    source: case
    path: subjects.0.display_name
    purpose: KYC_SCREENING
    classification: PII
    required: true
  - id: country
    source: case
    path: subjects.0.attributes.country
    purpose: KYC_SCREENING
    classification: PII
    required: false
  - id: dateOfBirth
    source: case
    path: subjects.0.attributes.dateOfBirth
    purpose: KYC_SCREENING
    classification: PII
    required: false
  - id: policyGateContext
    source: case
    path: $
    purpose: KYC_POLICY_EVALUATION
    classification: CONFIDENTIAL
    required: true
  - id: assessmentContext
    source: case
    path: $
    purpose: KYC_DECISION_SUPPORT
    classification: CONFIDENTIAL
    required: true
  - id: investigationContext
    source: case
    path: $
    purpose: KYC_INVESTIGATION
    classification: CONFIDENTIAL
    required: true
  - id: reviewContext
    source: case
    path: $
    purpose: KYC_HUMAN_REVIEW
    classification: CONFIDENTIAL
    required: true
contextClassificationPolicies:
  - classification: PII
    action: allow
  - classification: CONFIDENTIAL
    action: allow
allowedRegions: [US]
dataClasses: [PII, CONFIDENTIAL, PUBLIC_SOURCE]
evaluationRequirements: [kyc-gate-corpus, sanctions-provider-contract, pep-provider-contract, independent-review]

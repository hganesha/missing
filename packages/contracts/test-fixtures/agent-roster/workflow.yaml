    - id: identity-verification-review
      kind: agent
      name: Identity and verification agent (review)
      summary: Establish and verify the legal identity and existence of the customer and its parties from admitted verification and registry records; preserve unverified and conflicting identities as such.
      role: Identity analyst
      prompt: "Read the verification and registry records the skills evaluated and the document assertions beside them. Validate an identifier's format only when its issuer is known, and look a registry or identifier service up only when it could confirm or contradict an identity. Report every party as verified by a named record, unverified, or in conflict, and every document field you compared as matching, conflicting or not on record. A tamper signal on a document weakens what it states: name it in a finding, and never treat its absence as proof."
      contextSelectorIds:
        - caseSubjects
        - recRelationship-identity-verification-review-entity-relationship-resolve
        - readExtractedAssertion-identity-verification-review
        - readDocumentPage-identity-verification-review
        - readIdentity-identity-verification-review
        - readIdentityIdentifier-identity-verification-review
        - readVerificationRecord-identity-verification-review
        - readRegistryRecord-identity-verification-review
        - readAddress-identity-verification-review
        - readFraudSignal-identity-verification-review
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - verifications
          - documentChecks
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            type: boolean
          verifications:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - entityRef
                - status
                - sourceRefs
              properties:
                entityRef:
                  type: string
                  minLength: 1
                status:
                  type: string
                  enum:
                    - VERIFIED_BY_RECORD
                    - UNVERIFIED
                    - CONFLICT
                sourceRefs:
                  type: array
                  items:
                    type: string
          documentChecks:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - entityRef
                - field
                - outcome
                - sourceRefs
              allOf:
                - if:
                    properties:
                      outcome:
                        enum:
                          - MATCH
                          - CONFLICT
                  then:
                    properties:
                      sourceRefs:
                        minItems: 2
              properties:
                entityRef:
                  type: string
                  minLength: 1
                field:
                  type: string
                  minLength: 1
                documentValue:
                  type:
                    - string
                    - "null"
                recordValue:
                  type:
                    - string
                    - "null"
                outcome:
                  type: string
                  enum:
                    - MATCH
                    - CONFLICT
                    - NOT_ON_RECORD
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1

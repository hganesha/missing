      config:
        agentRef: agent.qa_assurance
        loop:
          maxSteps: 6
          maxObservationChars: 24000
          tools: []
          skills:
            - skillId: quality.hallucination.detect
              contextSelectorIds:
                - recFinding-qa-assurance-review-quality-hallucination-detect
                - recEvidence-qa-assurance-review-quality-hallucination-detect
              parameters: {}
              purpose: onboarding
            - skillId: quality.coverage.assess
              contextSelectorIds: []
              parameters: {}
              purpose: onboarding
          repairAttempts: 1
        completion:
          criteria:
            - nodeId: quality-findings-verify
              acceptedStatuses:
                - COMPLETED
              requiredPayloadFields:
                - checks
                - semantic_review_required
            - nodeId: quality-policy-compliance
              acceptedStatuses:
                - COMPLETED
              requiredPayloadFields:
                - compliant
                - unresolved
          failurePolicy:
            ambiguous_evidence: NEEDS_REVIEW
            missing_required_evidence: NEEDS_EVIDENCE
            unavailable_required_source: BLOCKED
        evidenceCapture:
          type: roster_qa_assurance_review
          sourceType: DERIVED
          trustTier: AGENT_DERIVED
          instructionTrust: UNTRUSTED_DATA
        caseWriteActor: agent
        caseWritePrincipalId: agent.qa_assurance
        caseWrites:
          - commandType: LinkEvidence
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: ROSTER_QA_ASSURANCE_REVIEW
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
    - id: decision-human-review
      kind: tool
      name: decision.human.review
      summary: Suspend for an authenticated independent human review.
      contextSelectorIds:
        - caseSubjects
      config:
        skillId: decision.human.review
        skillParameters:
          action: REVIEW_CASE
        skillPurpose: onboarding
        libraryStep: decision_human_review
        libraryEffects: human_gated
        agentRef: agent.decision_support
        caseWrites:
          - commandType: LinkEvidence
            skillGrant: proposal
          - commandType: ProposeClaim
            skillGrant: proposal
          - commandType: RecordScreeningFinding
            skillGrant: proposal
          - commandType: RaiseContradiction
            skillGrant: proposal
          - commandType: ProposeWorkItem
            skillGrant: proposal
          - commandType: RecordCanonicalRecords
            skillGrant: proposal
    - id: decision-human-review-approval
      kind: approval
      name: "Independent approval: decision.human.review"
      summary: A different, authorized person approves the review (dual control).
      contextSelectorIds:
        - caseSubjects
      config:
        dualControlRequired: true
        allowedDecisions:
          - APPROVE
          - REJECT
    - id: decision-human-review-effects
      kind: transform
      name: "Release approved effects: decision.human.review"
      summary: Commit the skill's held effects after an approval (re-validating case sequence and expiry), or discard them after a rejection; an external action without an outbound route stays a pending intent.
      contextSelectorIds: []
      config:
        operation: select
        path: /
        skillEffectRelease:
          skillNodeId: decision-human-review
          approvalNodeId: decision-human-review-approval
        caseWrites: []
    - id: stopped
      kind: output
      name: Stopped for handoff
      summary: Handoff.
      config:
        usePredecessorInput: true
    - id: result
      kind: output
      name: Result
      summary: Reached only after an approved review.
      config:
        usePredecessorInput: true

  - id: agent.identity_verification
    version: 1.2.0
    name: Identity and verification agent
    description: Establish and verify the legal identity and existence of the customer and its parties from admitted verification and registry records; preserve unverified and conflicting identities as such.
    role: Identity analyst
    prompt: "Decide, for the customer and each party, whether an admitted record verifies who they are. A name match is not verification; an identifier that does not validate is a conflict, not a typo. Compare what each identity or company document states (the extracted assertions) with the identity, verification and registry records: a date of birth, document number, registration number or address that differs is a conflict to report, whichever source looks more plausible. A company document's registered name, number and registered office are compared with the registry record the same way. Escalate to a person on: ambiguous evidence, policy exception, consequential decision."
    instructions:
      - id: agent.identity_verification.skills
        version: 1.2.0
        name: Run the agent's business skills
        description: The deterministic skills agent.identity_verification runs, each pinned to its manifest.
        text: Run each business skill exactly as the workflow binds it, over the records the platform selects. A skill's payload is evidence for review, not a decision.
        allowedCapabilityIds:
          - skill.entity.resolve.v0
          - skill.entity.identity.verify.v0
          - skill.registry.company.verify.v0
      - id: agent.identity_verification.review
        version: 1.2.0
        name: "Identity and verification agent: review"
        description: Establish and verify the legal identity and existence of the customer and its parties from admitted verification and registry records; preserve unverified and conflicting identities as such.
        text: "Read the verification and registry records the skills evaluated and the document assertions beside them. Validate an identifier's format only when its issuer is known, and look a registry or identifier service up only when it could confirm or contradict an identity. Report every party as verified by a named record, unverified, or in conflict, and every document field you compared as matching, conflicting or not on record. A tamper signal on a document weakens what it states: name it in a finding, and never treat its absence as proof."
        allowedCapabilityIds:

agentProfiles:
  - id: agent.intake_profile
    version: 1.1.0
    name: Intake and profile agent
    description: Establish legal customer, party roles, capacity, banking products, expected activity and lifecycle-specific information gaps.
    role: Onboarding specialist
    prompt: "Establish who the customer is, which parties hold which roles, which products are requested and what information the case still lacks. You describe the case; you do not judge its risk or acceptability. Escalate to a person on: ambiguous evidence, policy exception, consequential decision."
    instructions:
      - id: agent.intake_profile.skills
        version: 1.1.0
        name: Run the agent's business skills
        description: The deterministic skills agent.intake_profile runs, each pinned to its manifest.
        text: Run each business skill exactly as the workflow binds it, over the records the platform selects. A skill's payload is evidence for review, not a decision.
        allowedCapabilityIds:
          - skill.party.profile.build.v0
          - skill.party.type.classify.v0
          - skill.party.profile.completeness.v0
      - id: agent.intake_profile.review
        version: 1.1.0
        name: "Intake and profile agent: review"
        description: Establish legal customer, party roles, capacity, banking products, expected activity and lifecycle-specific information gaps.
        text: Read the canonical party, relationship and product records; the banking relationship names the customer and each party's legal form. Classify the customer, list every party with its roles, and name each missing piece of information with the record or document that would supply it. Look a company up in a registry or an identifier service only when a party's legal identity is unclear.
        allowedCapabilityIds:
          - model.intake-profile.loop.v1
          - business.registry.lookup.v1
          - reference.identifier.lookup.v1
          - skill.party.activity.profile.v0
    allowedSkills:
      - skillId: party.activity.profile
        semver: 0.3.0
      - skillId: party.profile.build
        semver: 0.3.0
      - skillId: party.profile.completeness
        semver: 0.3.0
      - skillId: party.type.classify
        semver: 0.3.0
    modelProfileId: model.standard.v1
    runtimeTarget: hosted_http
    primaryCapabilityId: model.intake-profile.loop.v1

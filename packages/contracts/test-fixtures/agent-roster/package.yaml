    version: 1.1.0
    name: Decision support agent
    description: Reconcile applicable obligations and evidence into a product-specific recommendation, restrictions, approval authority and monitoring handoff for authorized human review.
    role: Compliance officer (advisory)
    prompt: "Reconcile the case's obligations and evidence into a recommendation for the people who decide. You recommend; you never approve, decline or finalize, and every recommendation goes to human review. Escalate to a person on: ambiguous evidence, policy exception, consequential decision."
    instructions:
      - id: agent.decision_support.skills
        version: 1.1.0
        name: Run the agent's business skills
        description: The deterministic skills agent.decision_support runs, each pinned to its manifest.
        text: Run each business skill exactly as the workflow binds it, over the records the platform selects. A skill's payload is evidence for review, not a decision.
        allowedCapabilityIds:
          - skill.decision.requirements.compile.v0
          - skill.decision.controls.assess.v0
          - skill.decision.rules.evaluate.v0
          - skill.decision.recommendation.generate.v0
          - skill.decision.human.review.v0
      - id: agent.decision_support.review
        version: 1.1.0
        name: "Decision support agent: review"
        description: Reconcile applicable obligations and evidence into a product-specific recommendation, restrictions, approval authority and monitoring handoff for authorized human review.
        text: "Use the compiled requirements, rule evaluations and recommendation. Evaluate gaps when a requirement is unmet. Cite the records behind every point; recommend COLLECT_EVIDENCE when something required is missing, and ESCALATE when policy, sanctions or ownership findings need a senior decision. Read the earlier agents' findings and the screening hits: they are unverified proposals, but a blocking sanctions or ownership finding is never a matter of collecting evidence alone."
        allowedCapabilityIds:
          - model.decision-support.loop.v1
          - skill.decision.gaps.evaluate.v0
    allowedSkills:
      - skillId: decision.controls.assess
        semver: 0.3.0
      - skillId: decision.gaps.evaluate
        semver: 0.3.0
      - skillId: decision.human.review
        semver: 0.3.0
      - skillId: decision.recommendation.generate
        semver: 0.3.0
      - skillId: decision.requirements.compile
        semver: 0.3.0
      - skillId: decision.rules.evaluate
        semver: 0.3.0
    modelProfileId: model.deep.v1
    runtimeTarget: hosted_http
    primaryCapabilityId: model.decision-support.loop.v1
    inputSchema:
      type: object
    outputSchema:
      type: object
      additionalProperties: false
      required:
        - summary
        - findings
        - gaps
        - requiresHumanReview
        - recommendation
        - rationale
        - citedRecords
        - final
      properties:
        summary:
          type: string
          minLength: 1
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - severity
              - reason
              - sourceRefs
            properties:
              type:
                type: string
                minLength: 1
              severity:
                type: string
                enum:
                  - INFO
                  - REVIEW
                  - BLOCKING
              reason:
                type: string
                minLength: 1
              sourceRefs:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
        gaps:
          type: array
          items:
            type: string
        requiresHumanReview:
          const: true
        recommendation:
          type: string
          enum:
            - REVIEW_FOR_ACCEPTANCE
            - COLLECT_EVIDENCE
            - ESCALATE
            - RECOMMEND_DECLINE
        rationale:
          type: string
          minLength: 1
        citedRecords:
          type: array
          minItems: 1
          items:
            type: string
        final:
          const: false
    purposes:
      - CDD_ONBOARDING
    limits:
      maxSteps: 6
      maxObservationChars: 24000

        allowedCapabilityIds:
          - skill.quality.findings.verify.v0
          - skill.quality.policy.compliance.v0
      - id: agent.qa_assurance.review
        version: 1.1.0
        name: "QA and assurance agent: review"
        description: Independently challenge legal applicability, omitted parties, evidence sufficiency, stale sources, unsupported findings, overrides and monitoring handoff.
        text: Use the findings verification and policy compliance results. Check for unsupported claims or coverage gaps only where an agent's output or a finding warrants it. Raise each challenge with the records it rests on; an absent record is a challenge, never a pass.

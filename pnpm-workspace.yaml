packages:
  - apps/*
  - packages/*
  - e2e/ui
  - e2e/connectors

# CVE-2026-45623 / CVE-2026-73646: postcss 8.5.8 is unsafe.
# Pin the reviewed, patched version for every build consumer (Vite pulls it in).
overrides:
  postcss: 8.5.28
  # Patched versions for HIGH advisories in transitive dependencies (pnpm audit, Trivy):
  # grpc-js CVE-2026-101916, source-map-js CVE-2026-93749, undici CVE-2026-87018/109383/
  # 109829/109869, zod CVE via @langchain/core, vite CVE-2026-112942 (vitest's vite 8;
  # scoped to vitest because a global vite override would also rewrite plugins' peer ranges).
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  source-map-js@<1.2.2: 1.2.2
  undici@>=7.0.0 <7.30.1: 7.30.1
  zod@>=4.0.0 <4.6.6: 4.6.6
  vitest>vite: 8.3.3

allowBuilds:
  esbuild: true
  # MSW's postinstall only copies its worker; apps/web generates that file explicitly.
  msw: false
  protobufjs: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.85'
  - '@ai-sdk/provider-utils@5.0.43'
  - '@ai-sdk/provider@4.0.17'
  - ai@7.0.105

onlyBuiltDependencies:
  - esbuild
  - protobufjs
